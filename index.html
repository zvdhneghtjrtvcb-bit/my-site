<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="مطوّر تطبيقات ومواقع - حساباتي ومشاريعي">
<meta name="theme-color" content="#0b0e14">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="أحمد جبارة">
<meta property="og:description" content="مطوّر تطبيقات ومواقع - حساباتي ومشاريعي">

<style>
:root{--bg:#0b0e14;--bg2:#141a26;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.12);--tx:#f2f4f8;--sub:#9aa4b5;--ac:#6ea8ff}
:root.light{--bg:#eef1f6;--bg2:#ffffff;--card:rgba(255,255,255,.85);--bd:rgba(0,0,0,.08);--tx:#161a22;--sub:#5d6778;--ac:#2f6fe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:"Noto Sans Arabic",Tajawal,system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(18px,env(safe-area-inset-top)) 14px 40px}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bgfx i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.28;animation:fl 22s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:#4f7cff;top:-20vmax;left:-15vmax}
.bgfx i:nth-child(2){background:#a46bff;bottom:-25vmax;right:-20vmax;animation-delay:-8s}
:root.light .bgfx i{opacity:.16}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.wrap{max-width:460px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:9px 14px;font-size:14px;font-family:inherit;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill .svg{width:18px;height:18px}
.svg{display:block}
.svg svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{text-align:center;margin:18px 0 12px}
.av{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6ea8ff,#a46bff);box-shadow:0 10px 30px rgba(110,168,255,.35)}
h1{margin:0;font-size:26px}
.bio{margin:6px 0 0;color:var(--sub);font-size:15px}
.act{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.sec{font-size:13px;color:var(--sub);margin:20px 6px 8px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:12px;margin-bottom:10px;text-decoration:none;color:var(--tx);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:in .6s backwards;transition:transform .15s}
.card:active{transform:scale(.98)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.ic{flex:none;width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ic .svg{width:26px;height:26px}
.ic img{width:100%;height:100%;object-fit:cover}
.txt{flex:1;min-width:0}
.app{font-size:11px;letter-spacing:.06em;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.soon{background:var(--bd);padding:2px 8px;border-radius:99px}
.ttl{font-size:16px;font-weight:600;margin-top:2px}
.sub{font-size:13px;color:var(--sub);margin-top:1px;direction:ltr;unicode-bidi:plaintext;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsc{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.cp{flex:none;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-size:14px;font-family:inherit;cursor:pointer}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:22px}
#qr{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#qr.on{display:flex}
.qbox{background:var(--bg2);border:1px solid var(--bd);border-radius:22px;padding:20px;text-align:center;max-width:300px;width:100%}
#qrbox{background:#fff;border-radius:12px;padding:12px;display:inline-block;min-width:244px;min-height:244px;color:#111;font-size:13px}
#qrt{color:var(--sub);font-size:13px;margin:12px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
#toast.on{opacity:1}
</style></head><body>
<div class="bgfx"><i></i><i></i></div>
<div class="wrap">
  <div class="top"><button class="pill" id="lang"></button><button class="pill" id="theme"></button></div>
  <div class="hero">
    <div class="av" id="av"></div>
    <h1 id="nm"></h1>
    <p class="bio" id="bio"></p>
    <div class="act"><button class="pill" id="sh"></button><button class="pill" id="qb"></button><button class="pill" id="ib" style="display:none"></button></div>
  </div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="qr"><div class="qbox"><div id="qrbox"></div><p id="qrt"></p><button class="pill" id="qx"></button></div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
(function(){
var T={
 ar:{now:'الآن',soon:'قريباً',accounts:'حساباتي',works:'أعمالي',pay:'الدفع',more:'استراحة',sham:'شام كاش',shamT:'كود الدفع',copy:'نسخ',copied:'تم النسخ ✓',calm:'ركن الهدوء',calmT:'لحظة راحة نفسية',foot:'أهلاً بك في موقعي',lang:'English',dark:'داكن',light:'فاتح',share:'مشاركة',qr:'رمز QR',inst:'تثبيت',scan:'امسح الرمز لفتح الموقع',qrfail:'تعذّر تحميل مولّد الرمز، تأكد من الاتصال',lnk:'تم نسخ رابط الموقع',close:'إغلاق'},
 en:{now:'now',soon:'Soon',accounts:'My accounts',works:'My work',pay:'Payment',more:'Relax',sham:'Sham Cash',shamT:'Payment code',copy:'Copy',copied:'Copied ✓',calm:'Calm corner',calmT:'A moment of peace',foot:'Welcome to my site',lang:'عربي',dark:'Dark',light:'Light',share:'Share',qr:'QR code',inst:'Install',scan:'Scan the code to open the site',qrfail:'Could not load the QR generator, check your connection',lnk:'Site link copied',close:'Close'}
};
var ICONS={
 instagram:'<rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
 facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
 youtube:'<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/>',
 telegram:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
 snapchat:'<path fill="currentColor" stroke="none" d="M12 3c-3 0-5 2.2-5 5v2.2c-.7.2-1.5.4-2.2.5.3.6.9.9 1.7 1-.4.9-1.1 1.6-2 2 .8.7 1.9.9 3 1 .3.5.7.9 1.2.9.8 0 1.4-.5 3.3-.5s2.5.5 3.3.5c.5 0 .9-.4 1.2-.9 1.1-.1 2.2-.3 3-1-.9-.4-1.6-1.1-2-2 .8-.1 1.4-.4 1.7-1-.7-.1-1.5-.3-2.2-.5V8c0-2.8-2-5-5-5z"/>',
 whatsapp:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
 card:'<rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
 moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
 sun:'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
 globe:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
 share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
 qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h2v2h-2zM18 14h3M14 18v3M18 18h3v3"/>',
 download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
 code:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
 link:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'
};
var lang='ar',light=false;
try{lang=localStorage.getItem('lang')||'ar';light=localStorage.getItem('theme')==='light';}catch(e){}
var cfg=window.CFG||{links:[],works:[],sham:{code:''}};

function $(id){return document.getElementById(id);}
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!==undefined&&txt!==null)e.textContent=txt;if(cls)e.className=cls;return e;}
function ic(name){var s=el('span','','svg');s.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||ICONS.link)+'</svg>';return s;}
function pill(btn,icon,text){btn.replaceChildren(ic(icon),document.createTextNode(text));}
var tt=0;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},1800);}
function copyText(s,done){
  function fb(){var t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);done();}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(done,fb);}else fb();
}
function card(o,i){
  var a=el(o.href?'a':'div','','card');
  if(o.href){a.href=o.href;a.target='_blank';a.rel='noopener noreferrer';}
  a.style.animationDelay=(i*0.07)+'s';
  var ib=el('div','','ic');
  ib.style.background='linear-gradient(135deg,'+(o.c1||'#6ea8ff')+','+(o.c2||'#a46bff')+')';
  ib.style.color=o.fg||'#fff';
  ib.appendChild(ic(o.icon));
  if(o.img){var im=new Image();im.alt='';im.onload=function(){ib.replaceChildren(im);ib.style.background='#fff';};im.src=o.img;}
  var tx=el('div','','txt');
  var ap=el('div','','app');ap.appendChild(el('span',o.app));
  ap.appendChild(o.soon?el('span',T[lang].soon,'soon'):el('span',T[lang].now));
  tx.appendChild(ap);tx.appendChild(el('div',o.title,'ttl'));
  if(o.sub)tx.appendChild(el('div',o.sub,'sub'));
  if(o.desc)tx.appendChild(el('div',o.desc,'dsc'));
  a.appendChild(ib);a.appendChild(tx);
  if(o.copy){
    var b=el('button',T[lang].copy,'cp');
    b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();copyText(o.copy,function(){b.textContent=T[lang].copied;setTimeout(function(){b.textContent=T[lang].copy;},1600);});});
    a.appendChild(b);
  }
  return a;
}
function pick(o,k){return lang==='ar'?o[k+'_ar']:o[k+'_en'];}
function render(){
  var L=T[lang],i=0,list=$('list');
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.documentElement.classList.toggle('light',light);
  var name=pick(cfg,'name');
  document.title=name||'Ahmed';
  $('nm').textContent=name||'';
  $('bio').textContent=pick(cfg,'bio')||'';
  $('av').textContent=(name||'A').trim().charAt(0);
  pill($('lang'),'globe',L.lang);
  pill($('theme'),light?'moon':'sun',light?L.dark:L.light);
  pill($('sh'),'share',L.share);
  pill($('qb'),'qr',L.qr);
  pill($('ib'),'download',L.inst);
  pill($('qx'),'link',L.close);
  $('qrt').textContent=L.scan;
  $('foot').textContent=L.foot;
  list.replaceChildren();
  if((cfg.links||[]).length){
    list.appendChild(el('div',L.accounts,'sec'));
    cfg.links.forEach(function(k){list.appendChild(card({href:k.url,icon:k.icon,c1:k.c1,c2:k.c2,fg:k.fg,app:pick(k,'app'),title:pick(k,'title'),sub:k.handle},i++));});
  }
  if((cfg.works||[]).length){
    list.appendChild(el('div',L.works,'sec'));
    cfg.works.forEach(function(w){list.appendChild(card({href:w.url||'',soon:!w.url,icon:w.icon||'code',c1:'#2b5876',c2:'#4e4376',app:L.works,title:pick(w,'title'),desc:pick(w,'desc')},i++));});
  }
  if(cfg.sham&&cfg.sham.code){
    list.appendChild(el('div',L.pay,'sec'));
    list.appendChild(card({img:'logo.png',icon:'card',c1:'#1fa971',c2:'#0d7a4f',app:L.sham,title:L.shamT,sub:cfg.sham.code,copy:cfg.sham.code},i++));
  }
  list.appendChild(el('div',L.more,'sec'));
  list.appendChild(card({href:'game.html',icon:'moon',c1:'#3b3f9e',c2:'#7b4fd1',app:L.calm,title:L.calmT},i++));
}
$('lang').addEventListener('click',function(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('lang',lang);}catch(e){}render();});
$('theme').addEventListener('click',function(){light=!light;try{localStorage.setItem('theme',light?'light':'dark');}catch(e){}render();});
$('sh').addEventListener('click',function(){
  var d={title:document.title,url:location.href};
  if(navigator.share){navigator.share(d).catch(function(){});}
  else copyText(location.href,function(){toast(T[lang].lnk);});
});
function showQR(){
  $('qr').classList.add('on');
  var box=$('qrbox');
  if(box.getAttribute('data-done'))return;
  box.textContent='...';
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload=function(){box.replaceChildren();new QRCode(box,{text:location.href.split('#')[0],width:220,height:220,colorDark:'#000000',colorLight:'#ffffff'});box.setAttribute('data-done','1');};
  s.onerror=function(){box.textContent=T[lang].qrfail;};
  document.head.appendChild(s);
}
$('qb').addEventListener('click',showQR);
$('qx').addEventListener('click',function(){$('qr').classList.remove('on');});
$('qr').addEventListener('click',function(e){if(e.target===$('qr'))$('qr').classList.remove('on');});
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;$('ib').style.display='';});
$('ib').addEventListener('click',function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;$('ib').style.display='none';});});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
render();
})();
</script></body></html>
