<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثلاثة على هاتف واحد</title>
<style>
body{margin:0;min-height:100vh;background:#0b0e14;color:#f2f4f8;font-family:system-ui,sans-serif;padding:20px 14px}
.w{max-width:460px;margin:0 auto;text-align:center}
h1{font-size:22px}
input,button{font-size:16px;padding:12px;border-radius:12px;border:1px solid #33415c;background:#141a26;color:#fff;width:100%;box-sizing:border-box;margin-top:8px}
button{background:#2f81f7;border:0;cursor:pointer}
button.gray{background:#6e7681}
.box{background:rgba(255,255,255,.07);border-radius:18px;padding:16px;margin-top:14px}
.res{font-size:20px;margin:12px 0;min-height:40px}
.warn{font-size:13px;color:#d29922;margin-top:10px}
canvas{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
a{color:#6ea8ff}
</style></head><body><div class="w">
<h1>👥 ثلاثة على هاتف واحد</h1>
<div class="box" id="setup">
  <input id="p1" placeholder="اسم اللاعب الأول">
  <input id="p2" placeholder="اسم اللاعب الثاني">
  <input id="p3" placeholder="اسم اللاعب الثالث">
  <textarea id="chal" rows="5" style="font-size:16px;padding:12px;border-radius:12px;border:1px solid #33415c;background:#141a26;color:#fff;width:100%;box-sizing:border-box;margin-top:8px" placeholder="اكتب خمسة تحديات، سطر لكل تحدٍّ"></textarea>
  <button onclick="begin()">ابدأ</button>
</div>
<div class="box" id="game" style="display:none">
  <canvas id="wheel" width="340" height="340"></canvas>
  <div class="res" id="r1"></div>
  <div class="res" id="r2"></div>
  <button id="spin" onclick="spin()">🎡 دوّر العجلة</button>
  <button id="fail" class="gray" onclick="punish()" style="display:none">❌ لم ينفّذ / لم يُجب</button>
  <div class="res" id="r3"></div>
  <p class="warn">العقاب ضربة خفيفة باليد على اليد فقط، وباتفاق الجميع قبل اللعب.</p>
</div>
<p><a href="games.html">← قائمة الألعاب</a></p>
</div>
<script>
var P=[],C=[],step=0,target=null,spinning=false,ang=0;
var COL=['#2f81f7','#f85149','#3fb950','#d29922','#a371f7','#db61a2'];
function draw(labels){
  var cv=document.getElementById('wheel'),g=cv.getContext('2d');
  var n=labels.length,cx=170,cy=170,r=160,seg=2*Math.PI/n;
  g.clearRect(0,0,340,340);
  for(var i=0;i<n;i++){
    g.beginPath();g.moveTo(cx,cy);
    g.arc(cx,cy,r,ang+i*seg,ang+(i+1)*seg);g.closePath();
    g.fillStyle=COL[i%COL.length];g.fill();
    g.strokeStyle='#0b0e14';g.lineWidth=2;g.stroke();
    g.save();g.translate(cx,cy);g.rotate(ang+(i+.5)*seg);
    g.fillStyle='#fff';g.font='bold 15px system-ui';g.textAlign='right';
    g.fillText(labels[i],r-14,5);g.restore();
  }
  g.beginPath();g.moveTo(cx+r+6,cy);g.lineTo(cx+r-16,cy-10);g.lineTo(cx+r-16,cy+10);g.closePath();
  g.fillStyle='#fff';g.fill();
}
function begin(){
  P=[1,2,3].map(function(i){return document.getElementById('p'+i).value.trim()||('لاعب '+i);});
  C=document.getElementById('chal').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  if(C.length<1){alert('اكتب تحدياً واحداً على الأقل');return;}
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='block';
  step=0;draw(P);
  document.getElementById('r1').textContent='ابدأ الدوران الأول: من يبدأ؟';
}
function rotateTo(labels,index,done){
  var n=labels.length,seg=2*Math.PI/n;
  var base=-Math.PI/2-(index+.5)*seg;
  var turns=5+Math.floor(Math.random()*3);
  var start=ang,end=base+turns*2*Math.PI;
  var t0=null,dur=3500;
  spinning=true;
  function frame(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);
    ang=start+(end-start)*e;
    draw(labels);
    if(p<1)requestAnimationFrame(frame);
    else{ang=base%(2*Math.PI);draw(labels);spinning=false;done();}
  }
  requestAnimationFrame(frame);
}
function spin(){
  if(spinning)return;
  var btn=document.getElementById('spin');
  if(step===0){
    var idx=Math.floor(Math.random()*P.length);
    rotateTo(P,idx,function(){
      target=P[idx];
      document.getElementById('r1').textContent='👤 الدور على: '+target;
      document.getElementById('r2').textContent='';
      document.getElementById('r3').textContent='';
      step=1;btn.textContent='🎡 دوّر للتحدي أو السؤال';
    });
  }else if(step===1){
    var labels=['تحدٍّ','سؤال'];
    var k=Math.floor(Math.random()*2);
    rotateTo(labels,k,function(){
      if(k===0){
        var c=C[Math.floor(Math.random()*C.length)];
        document.getElementById('r2').textContent='🎯 تحدٍّ: '+c;
        document.getElementById('fail').style.display='block';
      }else{
        document.getElementById('r2').textContent='❓ سؤال: اطرحه أنت على '+target;
        document.getElementById('fail').style.display='none';
      }
      step=0;btn.textContent='🎡 دوّر للاعب التالي';
    });
  }
}
function punish(){
  var n=1+Math.floor(Math.random()*3);
  document.getElementById('r3').textContent='⚠️ '+target+': '+n+' ضربة خفيفة على اليد';
}
</script></body></html>
