<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ركن الهدوء</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a1030;font-family:system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tools{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px;z-index:3}
#tools button,#tools a,#bar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:9px 14px;font-size:14px;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bar{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px;z-index:3}
#bar button{padding:11px 12px;font-size:14px}
#bar button.on{background:rgba(255,255,255,.32);border-color:rgba(255,255,255,.6)}
#msg{position:fixed;left:0;right:0;top:16%;text-align:center;font-size:20px;line-height:1.7;opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:pre-line;text-shadow:0 2px 12px rgba(0,0,0,.6);z-index:2;padding:0 24px;box-sizing:border-box}
#msg.low{top:66%;font-size:26px}
</style></head><body>
<canvas id="c"></canvas>
<div id="tools">
<button id="snd">🔊 صوت</button>
<button id="thm">🎨 ليل</button>
<button id="clr" style="display:none">🧹 تمهيد</button>
<a href="index.html">→ الأدوات</a>
</div>
<div id="msg"></div>
<div id="bar">
<button data-m="water" class="on">💧 ماء</button>
<button data-m="sand">🪨 رمل</button>
<button data-m="lantern">🏮 فوانيس</button>
<button data-m="breath">🌬️ تنفّس</button>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2),TAU=Math.PI*2;
var sand=document.createElement('canvas'),sctx=sand.getContext('2d'),sandReady=false;
var mode='water',themeIdx=0,nowTs=performance.now(),last=nowTs,hintT=0;
var THEMES=[
{n:'ليل',top:'#0a1030',bot:'#1d2f55',stars:1,moon:1,sand:'#565b75'},
{n:'غروب',top:'#2a1a40',bot:'#e58a5c',stars:.3,moon:0,sand:'#c79a74'},
{n:'فجر',top:'#34557a',bot:'#f3cba8',stars:.18,moon:0,sand:'#d9cdbd'}
];
var SC=[220,261.63,293.66,329.63,392,440,523.25,587.33,659.25];
var STONES=[{x:.26,y:.34,r:24},{x:.72,y:.58,r:32},{x:.42,y:.8,r:19}];
var BPH=[{n:'شهيق',d:4},{n:'ثبات',d:4},{n:'زفير',d:6}];
var HINTS={water:'المس الماء واسحب إصبعك… كل لمسة نغمة',sand:'ارسم بالمشط على الرمل',lantern:'المس السماء لتُطلق فانوساً'};

function mkGlow(rgb){
  var s=document.createElement('canvas');s.width=s.height=64;
  var g=s.getContext('2d');
  var gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba('+rgb+',1)');
  gr.addColorStop(.25,'rgba('+rgb+',.45)');
  gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);
  return s;
}
var G={warm:mkGlow('255,196,120'),cool:mkGlow('170,205,255'),white:mkGlow('255,255,255'),fly:mkGlow('220,255,150')};

var grain=document.createElement('canvas');grain.width=grain.height=96;
(function(){
  var g=grain.getContext('2d');
  for(var i=0;i<900;i++){
    g.fillStyle=Math.random()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)';
    g.fillRect(Math.random()*96,Math.random()*96,1.4,1.4);
  }
})();
var patt=ctx.createPattern(grain,'repeat'),vig=null;
var stars=[],flies=[],ripples=[],lanterns=[],sparks=[];
var ptr={x:-999,y:-999,down:false,lx:0,ly:0,lt:0};
var autoT=2,lanternT=3,bStart=0,bIdx=-1,bTxt='';

/* ---------- الصوت ---------- */
var AC=null,master,delay,fb,noiseG,noiseF,soundOn=true;
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  AC=new C();
  master=AC.createGain();master.gain.value=soundOn?0.7:0;master.connect(AC.destination);
  delay=AC.createDelay(1.0);delay.delayTime.value=.38;
  fb=AC.createGain();fb.gain.value=.38;
  delay.connect(fb);fb.connect(delay);delay.connect(master);
  var dg=AC.createGain();dg.gain.value=0;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;
  [110,164.81,220.5].forEach(function(f,i){
    var o=AC.createOscillator();o.type='sine';o.frequency.value=f;
    var g=AC.createGain();g.gain.value=[.10,.06,.03][i];
    o.connect(g);g.connect(lp);o.start();
  });
  lp.connect(dg);dg.connect(master);
  dg.gain.setTargetAtTime(.5,AC.currentTime,3);
  var lfo=AC.createOscillator();lfo.frequency.value=.07;
  var lg=AC.createGain();lg.gain.value=200;
  lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  var len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var ns=AC.createBufferSource();ns.buffer=buf;ns.loop=true;
  noiseF=AC.createBiquadFilter();noiseF.type='bandpass';noiseF.frequency.value=1000;noiseF.Q.value=.7;
  noiseG=AC.createGain();noiseG.gain.value=0;
  ns.connect(noiseF);noiseF.connect(noiseG);noiseG.connect(master);ns.start();
}
function note(f,v,dur){
  if(!AC||!soundOn)return;
  dur=dur||2.6;
  var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+.03);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);g.connect(delay);
  o.start(t);o.stop(t+dur+.1);
  var o2=AC.createOscillator(),g2=AC.createGain();
  o2.type='triangle';o2.frequency.value=f*2;
  g2.gain.setValueAtTime(0,t);
  g2.gain.linearRampToValueAtTime(v*.18,t+.02);
  g2.gain.exponentialRampToValueAtTime(.0001,t+1.2);
  o2.connect(g2);g2.connect(master);
  o2.start(t);o2.stop(t+1.3);
}

/* ---------- الحجم والتهيئة ---------- */
function makeStars(){
  stars=[];
  var n=Math.min(170,Math.floor(W*H/6500));
  for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.75,r:Math.random()*1.2+.3,p:Math.random()*TAU,s:Math.random()*1.5+.6});
}
function makeFlies(){
  flies=[];
  for(var i=0;i<26;i++)flies.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,ph:Math.random()*TAU,s:.8+Math.random()*1.4,z:14+Math.random()*14});
}
function initSand(){
  sctx.clearRect(0,0,W,H);
  STONES.forEach(function(s){
    var x=s.x*W,y=s.y*H;
    for(var k=1;k<=5;k++){
      var rr=s.r*1.05+k*11;
      sctx.lineWidth=3.2;sctx.strokeStyle='rgba(0,0,0,.24)';
      sctx.beginPath();sctx.arc(x,y,rr,0,TAU);sctx.stroke();
      sctx.lineWidth=2;sctx.strokeStyle='rgba(255,255,255,.2)';
      sctx.beginPath();sctx.arc(x,y,rr+2.4,0,TAU);sctx.stroke();
    }
  });
}
function resize(){
  var tmp=null;
  if(sandReady){
    tmp=document.createElement('canvas');tmp.width=sand.width;tmp.height=sand.height;
    tmp.getContext('2d').drawImage(sand,0,0);
  }
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  sand.width=W*DPR;sand.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  sctx.setTransform(DPR,0,0,DPR,0,0);
  if(tmp){sctx.drawImage(tmp,0,0,W,H);}else{initSand();sandReady=true;}
  vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.45)');
  makeStars();
  if(!flies.length)makeFlies();
}

/* ---------- الرسم ---------- */
function drawMoon(){
  var mx=W*.76,my=H*.14,r=Math.min(W,H)*.055;
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.55;
  ctx.drawImage(G.cool,mx-r*5,my-r*5,r*10,r*10);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  var g=ctx.createRadialGradient(mx-r*.3,my-r*.3,r*.1,mx,my,r);
  g.addColorStop(0,'#fffdf2');g.addColorStop(1,'#d9dfef');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,r,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(150,160,185,.25)';
  ctx.beginPath();ctx.arc(mx+r*.3,my+r*.2,r*.22,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(mx-r*.35,my+r*.35,r*.14,0,TAU);ctx.fill();
}
function sky(t){
  var T=THEMES[themeIdx];
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,T.top);g.addColorStop(1,T.bot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(T.stars>0){
    ctx.fillStyle='#fff';
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      ctx.globalAlpha=T.stars*(.5+.5*Math.sin(t*.0015*s.s+s.p));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(T.moon){drawMoon();}
  else{
    var gy=mode==='water'?H*.45:H*.72;
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.6;
    ctx.drawImage(G.warm,W*.5-W*.7,gy-W*.45,W*1.4,W*.9);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
}
function hills(){
  var x;
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.moveTo(0,H);
  for(x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.86+Math.sin(x*.012+1)*H*.025+Math.sin(x*.005)*H*.03);
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.beginPath();ctx.moveTo(0,H);
  for(x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.93+Math.sin(x*.009+3)*H*.02);
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function updFlies(t,dt){
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<flies.length;i++){
    var f=flies[i];
    f.ph+=dt*f.s;
    f.vx+=(Math.random()-.5)*14*dt;f.vy+=(Math.random()-.5)*14*dt;
    if(ptr.down){
      var dx=ptr.x-f.x,dy=ptr.y-f.y,d2=dx*dx+dy*dy;
      if(d2<40000&&d2>1){f.vx+=dx*dt*.4;f.vy+=dy*dt*.4;}
    }
    var k=1-dt*.8;f.vx*=k;f.vy*=k;
    var sp=Math.sqrt(f.vx*f.vx+f.vy*f.vy);
    if(sp>40){f.vx*=40/sp;f.vy*=40/sp;}
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.x<-20)f.x=W+20;if(f.x>W+20)f.x=-20;
    if(f.y<-20)f.y=H+20;if(f.y>H+20)f.y=-20;
    ctx.globalAlpha=.25+.45*(.5+.5*Math.sin(f.ph));
    ctx.drawImage(G.fly,f.x-f.z/2,f.y-f.z/2,f.z,f.z);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ---------- الماء ---------- */
function drop(x,y,v){
  var idx=Math.min(SC.length-1,Math.max(0,Math.floor(x/W*SC.length)));
  var f=SC[idx];if(y>H*.78)f=f/2;
  note(f,.11*v,2.8);
  ripples.push({x:x,y:y,r:2,max:90+Math.random()*80+v*40,k:v});
  if(ripples.length>36)ripples.shift();
}
function moonReflect(t,hy){
  var mx=W*.76;
  ctx.fillStyle='rgba(235,240,255,.5)';
  for(var k=0;k<14;k++){
    var y=hy+8+k*(H-hy)*.055;
    var w=(26-k*1.4)*(1+.3*Math.sin(t*.003+k));
    if(w<2)continue;
    ctx.globalAlpha=Math.max(0,.32-k*.02);
    ctx.fillRect(mx-w/2+Math.sin(t*.002+k*.7)*5,y,w,1.6);
  }
  ctx.globalAlpha=1;
}
function water(t,dt){
  var hy=H*.45,i,x;
  var g=ctx.createLinearGradient(0,hy,0,H);
  g.addColorStop(0,'rgba(0,0,0,.18)');g.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=g;ctx.fillRect(0,hy,W,H-hy);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  for(i=0;i<24;i++){
    var y=hy+Math.pow(i/24,1.6)*(H-hy)+5,amp=1.5+i*.22;
    ctx.beginPath();
    for(x=0;x<=W+24;x+=24){
      var yy=y+Math.sin(x*.02+t*.0012+i)*amp*.5;
      if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  if(THEMES[themeIdx].moon)moonReflect(t,hy);
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,hy,W,1);
  autoT-=dt;
  if(autoT<=0){autoT=1.6+Math.random()*2.8;drop(Math.random()*W,H*.5+Math.random()*H*.42,.3);}
  ctx.lineWidth=1.6;
  for(i=ripples.length-1;i>=0;i--){
    var R=ripples[i];
    R.r+=70*dt;
    if(R.r>=R.max){ripples.splice(i,1);continue;}
    var a=(1-R.r/R.max)*Math.min(1,.45+R.k*.55);
    for(var j=0;j<3;j++){
      var rr=R.r-j*11;if(rr<=0)continue;
      ctx.strokeStyle='rgba(205,228,255,'+(a*(1-j*.28)*.9).toFixed(3)+')';
      ctx.beginPath();ctx.ellipse(R.x,R.y,rr,rr*.42,0,0,TAU);ctx.stroke();
    }
  }
}

/* ---------- الرمل ---------- */
function rake(x0,y0,x1,y1){
  var dx=x1-x0,dy=y1-y0,d=Math.sqrt(dx*dx+dy*dy);
  if(d<1)return;
  var nx=-dy/d,ny=dx/d;
  sctx.lineCap='butt';
  for(var i=-2;i<=2;i++){
    var o=i*10;
    sctx.lineWidth=3.4;sctx.strokeStyle='rgba(0,0,0,.26)';
    sctx.beginPath();sctx.moveTo(x0+nx*o,y0+ny*o);sctx.lineTo(x1+nx*o,y1+ny*o);sctx.stroke();
    sctx.lineWidth=2;sctx.strokeStyle='rgba(255,255,255,.22)';
    sctx.beginPath();sctx.moveTo(x0+nx*(o+2.6),y0+ny*(o+2.6));sctx.lineTo(x1+nx*(o+2.6),y1+ny*(o+2.6));sctx.stroke();
  }
}
function sandScene(){
  ctx.fillStyle=THEMES[themeIdx].sand;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=patt;ctx.fillRect(0,0,W,H);
  ctx.drawImage(sand,0,0,W,H);
  STONES.forEach(function(s){
    var x=s.x*W,y=s.y*H,r=s.r;
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.beginPath();ctx.ellipse(x+r*.25,y+r*.55,r*1.05,r*.45,0,0,TAU);ctx.fill();
    var g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.1);
    g.addColorStop(0,'#c9cbd1');g.addColorStop(.6,'#7d818c');g.addColorStop(1,'#4a4d57');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.ellipse(x,y,r,r*.82,0,0,TAU);ctx.fill();
  });
}

/* ---------- الفوانيس ---------- */
function launch(x,y,q){
  if(lanterns.length>36)lanterns.shift();
  lanterns.push({x:x,y:y,vy:26+Math.random()*22,ph:Math.random()*TAU,s:Math.max(20,Math.min(W,H)*.06)*(.8+Math.random()*.5),age:0,a:0});
  note(SC[Math.floor(Math.random()*SC.length)]/2,q?.04:.1,3.2);
}
function spark(x,y){
  sparks.push({x:x+(Math.random()-.5)*8,y:y+(Math.random()-.5)*8,vx:(Math.random()-.5)*14,vy:-8-Math.random()*18,l:1.2+Math.random(),m:2.2});
  if(sparks.length>160)sparks.shift();
}
function drawLantern(L){
  var s=L.s,x=L.x,y=L.y,a=L.a,w=s*.9,h=s*1.2;
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*.7;
  ctx.drawImage(G.warm,x-s*2.6,y-s*2.6,s*5.2,s*5.2);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=a;
  var gr=ctx.createLinearGradient(x,y-h/2,x,y+h/2);
  gr.addColorStop(0,'rgba(255,214,140,.98)');gr.addColorStop(1,'rgba(255,120,50,.95)');
  ctx.fillStyle=gr;
  ctx.beginPath();
  ctx.moveTo(x-w*.42,y-h/2);ctx.lineTo(x+w*.42,y-h/2);
  ctx.quadraticCurveTo(x+w*.62,y,x+w*.5,y+h/2);
  ctx.lineTo(x-w*.5,y+h/2);
  ctx.quadraticCurveTo(x-w*.62,y,x-w*.42,y-h/2);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(60,25,10,.85)';
  ctx.fillRect(x-w*.45,y-h/2-s*.06,w*.9,s*.1);
  ctx.fillRect(x-w*.52,y+h/2-s*.04,w*1.04,s*.1);
  ctx.globalAlpha=1;
}
function lanternStep(dt){
  lanternT-=dt;
  if(lanternT<=0){lanternT=4+Math.random()*4;launch(Math.random()*W,H*.97,true);}
  for(var i=lanterns.length-1;i>=0;i--){
    var L=lanterns[i];
    L.age+=dt;L.y-=L.vy*dt;L.x+=Math.sin(L.age*.8+L.ph)*16*dt;
    var fadeTop=Math.max(0,Math.min(1,L.y/(H*.2)));
    L.a=Math.min(1,L.age/1.2)*fadeTop;
    if(L.y<-L.s*2){lanterns.splice(i,1);continue;}
    if(Math.random()<dt*6)spark(L.x,L.y+L.s*.7);
    drawLantern(L);
  }
  ctx.globalCompositeOperation='lighter';
  for(var j=sparks.length-1;j>=0;j--){
    var s=sparks[j];
    s.l-=dt;
    if(s.l<=0){sparks.splice(j,1);continue;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    ctx.globalAlpha=Math.min(1,s.l/s.m*2)*.8;
    ctx.drawImage(G.warm,s.x-5,s.y-5,10,10);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ---------- التنفس ---------- */
function breath(t){
  var el=(t-bStart)/1000,total=14,cyc=Math.floor(el/total),x=el-cyc*total;
  var i=x<4?0:(x<8?1:2),ps=i===0?0:(i===1?4:8),d=BPH[i].d,p=(x-ps)/d;
  if(i!==bIdx){
    bIdx=i;
    if(i===0)note(261.63,.13,4.5);else if(i===2)note(196,.13,6.5);
  }
  var rmin=Math.min(W,H)*.11,rmax=Math.min(W,H)*.3,e=(1-Math.cos(Math.PI*p))/2;
  var r=i===0?rmin+(rmax-rmin)*e:(i===1?rmax:rmax-(rmax-rmin)*e);
  var cx=W/2,cy=H*.42;
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.55;ctx.drawImage(G.cool,cx-r*2.2,cy-r*2.2,r*4.4,r*4.4);
  ctx.globalAlpha=1;
  for(var k=0;k<8;k++){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(k*TAU/8+t*.00008);
    ctx.beginPath();ctx.ellipse(0,-r*.55,r*.26,r*.55,0,0,TAU);
    ctx.fillStyle='rgba(150,200,255,.10)';ctx.fill();
    ctx.strokeStyle='rgba(200,225,255,.35)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=.8;ctx.drawImage(G.white,cx-r*.45,cy-r*.45,r*.9,r*.9);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();
  var left=Math.max(1,Math.ceil(d-(x-ps)));
  var txt=BPH[i].n+' · '+left+'\nدورة '+(cyc+1);
  if(txt!==bTxt){bTxt=txt;msg.textContent=txt;msg.style.opacity=1;}
}

/* ---------- الحلقة الرئيسية ---------- */
function draw(t,dt){
  if(mode==='sand'){sandScene();}
  else{
    sky(t);
    if(mode==='water')water(t,dt);else hills();
    updFlies(t,dt);
    if(mode==='lantern')lanternStep(dt);
    if(mode==='breath')breath(t);
  }
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
}
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000);
  if(!(dt>0))dt=.016;
  last=ts;nowTs=ts;
  draw(ts,dt);
  requestAnimationFrame(loop);
}

/* ---------- التحكم ---------- */
function hint(t){
  msg.textContent=t;msg.style.opacity=1;
  clearTimeout(hintT);
  hintT=setTimeout(function(){msg.style.opacity=0;},4000);
}
function setMode(m){
  mode=m;
  Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(b){
    b.classList.toggle('on',b.getAttribute('data-m')===m);
  });
  document.getElementById('clr').style.display=m==='sand'?'':'none';
  msg.classList.toggle('low',m==='breath');
  bTxt='';
  clearTimeout(hintT);
  if(m==='breath'){bStart=nowTs;bIdx=-1;msg.style.opacity=0;}
  else hint(HINTS[m]);
  if(m==='lantern'&&lanterns.length<3){
    for(var k=0;k<4;k++){
      launch(W*(.15+Math.random()*.7),H*(.45+Math.random()*.45),true);
      lanterns[lanterns.length-1].age=1.2;
    }
  }
}
function pos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  var p=pos(e);
  ptr.down=true;ptr.x=p.x;ptr.y=p.y;ptr.lx=p.x;ptr.ly=p.y;ptr.lt=performance.now();
  if(mode==='water')drop(p.x,p.y,1);
  else if(mode==='lantern')launch(p.x,p.y,false);
});
cv.addEventListener('pointermove',function(e){
  var p=pos(e);ptr.x=p.x;ptr.y=p.y;
  if(!ptr.down)return;
  var dx=p.x-ptr.lx,dy=p.y-ptr.ly,d=Math.sqrt(dx*dx+dy*dy),now=performance.now();
  if(mode==='water'){
    if(d>42){drop(p.x,p.y,.55);ptr.lx=p.x;ptr.ly=p.y;}
  }else if(mode==='sand'){
    rake(ptr.lx,ptr.ly,p.x,p.y);
    if(AC&&noiseG){
      var sp=d/Math.max(8,now-ptr.lt);
      noiseG.gain.setTargetAtTime(Math.min(.14,sp*.06),AC.currentTime,.05);
      noiseF.frequency.setTargetAtTime(500+Math.min(2200,sp*700),AC.currentTime,.08);
    }
    ptr.lx=p.x;ptr.ly=p.y;ptr.lt=now;
  }else if(mode==='lantern'){
    if(d>30){for(var i=0;i<3;i++)spark(p.x,p.y);ptr.lx=p.x;ptr.ly=p.y;}
  }
});
function up(){
  ptr.down=false;
  if(AC&&noiseG)noiseG.gain.setTargetAtTime(0,AC.currentTime,.1);
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(b){
  b.addEventListener('click',function(){ensureAudio();setMode(b.getAttribute('data-m'));});
});
document.getElementById('snd').addEventListener('click',function(){
  ensureAudio();
  soundOn=!soundOn;
  if(AC&&master)master.gain.setTargetAtTime(soundOn?.7:0,AC.currentTime,.1);
  this.textContent=soundOn?'🔊 صوت':'🔇 صامت';
});
document.getElementById('thm').addEventListener('click',function(){
  themeIdx=(themeIdx+1)%THEMES.length;
  this.textContent='🎨 '+THEMES[themeIdx].n;
});
document.getElementById('clr').addEventListener('click',function(){
  initSand();hint('تم تمهيد الرمل');
});
window.addEventListener('resize',resize);
resize();
setMode('water');
requestAnimationFrame(loop);
})();
</script></body></html>
