<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الألعاب</title>
<style>
body{margin:0;min-height:100vh;background:#0b0e14;color:#f2f4f8;font-family:system-ui,sans-serif;padding:20px 14px}
.wrap{max-width:460px;margin:0 auto}
h1{font-size:24px;text-align:center;margin:10px 0 18px}
a.card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;margin-bottom:10px;color:#f2f4f8;text-decoration:none}
.ic{flex:none;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#3b3f9e,#7b4fd1);display:flex;align-items:center;justify-content:center}
.ic svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{font-size:17px;font-weight:600}
.d{font-size:13px;color:#9aa4b5;margin-top:3px}
.back{display:block;text-align:center;margin-top:24px;color:#6ea8ff;text-decoration:none}
</style></head><body>
<div class="wrap">
<h1>🎮 الألعاب</h1>
<div id="list"></div>
<a class="back" href="index.html">← الصفحة الرئيسية</a>
</div>
<script src="games.js"></script>
<script>
var ICON='<svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4"/><circle cx="15" cy="10" r="1"/><circle cx="17" cy="13" r="1"/><path d="M7 17l-2-6c-.3-1 .5-2 1.5-2h11c1 0 1.8 1 1.5 2l-2 6c-.2.6-.8 1-1.5 1H8.5c-.7 0-1.3-.4-1.5-1z"/></svg>';
var list=document.getElementById('list');
GAMES.forEach(function(g){
  var a=document.createElement('a');a.className='card';a.href=g.url;
  var ic=document.createElement('div');ic.className='ic';ic.innerHTML=ICON;
  var tx=document.createElement('div');
  var t=document.createElement('div');t.className='t';t.textContent=g.title_ar;
  var d=document.createElement('div');d.className='d';d.textContent=g.desc_ar;
  tx.appendChild(t);tx.appendChild(d);a.appendChild(ic);a.appendChild(tx);list.appendChild(a);
});
</script></body></html>
